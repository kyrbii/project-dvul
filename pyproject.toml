[project]
name = "project-dvul"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "streamlit",
    "langchain",
    "requests",
    "langchain-nvidia-ai-endpoints>=1.2.1",
    "dotenv>=0.9.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.9.0"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
