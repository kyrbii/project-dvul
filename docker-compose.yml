services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"

  
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "4200:4200"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend